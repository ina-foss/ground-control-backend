[project]
name = "ina-ground-control"
dynamic = ["version"]
description = "INA Ground Control"
authors = [
    { name = "Pablo RATOUIT", email = "pratouit-prestataire@ina.fr" },
    { name = "Benjamin ELKAYS", email = "belkays@ina.fr" },
    { name = "Molka JELASSI", email = "mjelassi-prestataire@ina.fr" },
    { name = "Denis RAKULAN", email = "drakulan-prestataire@ina.fr" },
    { name = "HOUNAIDA REKIK", email = "hrekik-prestataire@ina.fr" },
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ground-truth", "machine-learning", "data-processing", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "attrs>=22.2.0",
    "python-dateutil>=2.8.0",
    # Ground Control specific dependencies
    "h11==0.16.0",
    "fastapi==0.115.4",
    "pydantic>=2.10,<3.0.0",
    # Remove pinned pydantic-core - let pydantic manage its own core version
    "pydantic[email]",
    "sqlalchemy>=2.0.35",
    "uvicorn[standard]==0.34.2",
    "psycopg2-binary",
    "requests==2.31.0",
    "fastapi-keycloak-middleware==1.2.0",
    "python-dotenv==1.0.1",
    "alembic==1.16.2",
    "alembic-postgresql-enum==1.7.0",
    "jsonpath-ng==1.7.0",
    "opentelemetry-api==1.31.0",
    "opentelemetry-sdk==1.31.0",
    "opentelemetry-exporter-prometheus==0.52b0",
    "opentelemetry-instrumentation-fastapi==0.52b0",
    "opentelemetry-instrumentation-sqlalchemy==0.52b0",
    "pydantic-settings>=2.10.1",
    "requests-oauth2client==1.7.0",
    "httpx==0.28.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "pylint>=3.0.0",
    "pre-commit>=3.0.0",
    "pydevd-pycharm~=241.18034.62",
    "pytest-asyncio>=1.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]
docs = [
    "sphinx>=7.0.0",
    "myst-parser>=2.0.0",
    "sphinx-rtd-theme>=1.3.0",
]

[project.urls]
Repository = "https://git.infra.sas.ina/ia/code/ground-control/backend.git"
Documentation = "https://git.infra.sas.ina/ia/code/ground-control/docs.git"
"Bug Tracker" = "https://git.infra.sas.ina/ia/code/ground-control/backend/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["ina_ground_control"]

[tool.uv]
# UV-specific configuration
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "pylint>=3.0.0",
    "pre-commit>=3.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = [
    "--cov=ina_ground_control",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--strict-markers",
    "--strict-config",
]

markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Move asyncio_mode to a separate section
[tool.pytest_asyncio]
asyncio_mode = "auto"


[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.tox
  | \.venv
  | build
  | dist
  | alembic
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 120
known_first_party = ["ina_ground_control"]
known_third_party = ["fastapi", "pydantic", "sqlalchemy", "alembic"]

[tool.coverage.run]
source = ["ina_ground_control"]
omit = [
    "*/tests/*",
    "*/alembic/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false

[tool.pylint.main]
rcfile = ".pylintrc"

[dependency-groups]
docs = [
    "myst-parser>=4.0.1",
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.0.2",
]
