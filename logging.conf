[loggers]
keys=root,GroundControl

[handlers]
keys=consoleHandler

[formatters]
keys=otel_format

[logger_root]
level=WARNING
handlers=consoleHandler

[logger_GroundControl]
level=DEBUG
handlers=consoleHandler
qualname=GroundControl
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=otel_format
args=(sys.stdout,)

[formatter_otel_format]
format={"timestamp": "%(asctime)s", "severity": "%(levelname)s", "name": "%(name)s", "message": "%(message)s"}
