[tox]
envlist =  lint, coverage
isolated_build = true
skip_missing_interpreters = true

[testenv]
deps =
    -e.[test]
commands =
    pytest {posargs}
setenv =
    UV_NATIVE_TLS = 1
    UV_INSECURE_HOST = repo.sas.ina


[testenv:py{310,311,312,313}]
deps =
    -e.[test]
commands =
    pytest tests/ --cov=ina_ground_control_client --cov=ground_control_api_client
setenv =
    UV_NATIVE_TLS = 1
    UV_INSECURE_HOST = repo.sas.ina

[testenv:lint]
deps =
    -e.[dev]
commands =
    black --check --config pyproject.toml ina_ground_control/ tests/
    isort --check-only --settings-path pyproject.toml ina_ground_control/ tests/
    pylint ina_ground_control/
setenv =
    UV_NATIVE_TLS = 1
    UV_INSECURE_HOST = repo.sas.ina

[testenv:coverage]
deps =
    -e.[test]
commands =
    pytest --junitxml=junit_gc-client.xml --cov=ina_ground_control --cov=ina_ground_control --cov-report=html --cov-report=xml --cov-report=term-missing tests/unit
setenv =
    UV_NATIVE_TLS = 1
    UV_INSECURE_HOST = repo.sas.ina

[testenv:docs]
deps =
    -e.[docs]
commands =
    sphinx-build -b html docs/ docs/_build/html
setenv =
    UV_NATIVE_TLS = 1
    UV_INSECURE_HOST = repo.sas.ina

[testenv:format]
deps =
    -e.[dev]
commands =
    black --config pyproject.toml ina_ground_control/ tests/
    isort --settings-path pyproject.toml ina_ground_control/ tests/
    ruff check --fix --config pyproject.toml ina_ground_control/ tests/
setenv =
    UV_NATIVE_TLS = 1
    UV_INSECURE_HOST = repo.sas.ina