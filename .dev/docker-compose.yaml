services:
  db:
    image: postgres
    restart: always
    shm_size: 128mb
    volumes:
      - ./database/:/docker-entrypoint-initdb.d/
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: user
      POSTGRES_DB: ground_control_db
    ports:
      - 5432:5432

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    command: ["start-dev"]
    volumes:
      - ./realm-config:/opt/keycloak/data/import
    environment:
      - KC_DB=dev-file
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_FEATURES=scripts
      - KC_HTTP_PORT=9080
      - KC_HTTPS_PORT=9443
    ports:
      - 127.0.0.1:9080:9080
      - 127.0.0.1:9443:9443

  backend:
    build:
      context: ../
    volumes:
      - ../:/code
    ports:
      - 8000:8000
    depends_on:
      - db

  frontend:
    build:
      context: ../../front
    volumes:
      - ../../front:/app
      - app_node_modules:/app/node_modules
      - app_dotnuxt:/app/.nuxt
    ports:
      - 3000:3000

volumes:
  postgres_data:
  app_node_modules:
  app_dotnuxt:
